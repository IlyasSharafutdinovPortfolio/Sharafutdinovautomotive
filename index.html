<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharafutdinov</title>

<!-- SEO & Search Engine Indexing -->
<meta name="description" content="Sharafutdinov — Exclusive limited series hypercars. Request access for private viewings and reservations.">
<meta name="robots" content="index, follow">

<!-- OpenGraph (Social media preview) -->
<meta property="og:title" content="Sharafutdinov | Limited Series Hypercar">
<meta property="og:description" content="Exclusive limited series hypercars. Request access for private viewings and reservations.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sharafutdinov.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--white:#fff;--lav:#b9a4e8;--pink:#f4a3c9;--ink:#141018;
  --display:'Saira Condensed','Arial Narrow',Arial,sans-serif;--body:'Barlow','Helvetica Neue',Arial,sans-serif;
  --cut:18px;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;margin:0}

/* ПРЫГАЮЩИЙ СКРОЛЛ ПО СЕКЦИЯМ (включается только при разблокировке) */
html {
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto; scroll-snap-type:none}
  *{animation:none!important;transition:none!important}
}
body{font-family:var(--body);background:var(--black);color:var(--white);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

/* РЕЖИМ БЛОКИРОВКИ ДО ВВОДА КОДА */
body.locked {
  overflow: hidden !important;
}
body.locked .contact {
  display: none !important;
}
body.locked .burger,
body.locked .logo-btn,
body.locked .side.r {
  display: none !important; /* Прячем меню и кнопку перехода до ввода кода */
}

/* Настройки для каждого слайда */
.slide {
  height: 100vh;
  min-height: 100svh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  box-sizing: border-box;
}

.chamfer{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}

/* burger */
.burger{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 20px);left:20px;width:58px;height:50px;border:0;cursor:pointer;
  background:var(--lav);--cut:12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding-left:15px;transition:background .25s}
.burger span{display:block;height:2px;background:var(--black);transition:transform .3s,opacity .2s,width .3s}
.burger span:nth-child(1){width:28px}.burger span:nth-child(2){width:18px}.burger span:nth-child(3){width:28px}
.burger:hover{background:var(--pink)}
body.menu-open .burger{background:var(--black)}
body.menu-open .burger span{background:var(--pink)}
body.menu-open .burger span:nth-child(1){transform:translateY(8px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:20;background:var(--lav);color:var(--black);display:flex;flex-direction:column;justify-content:center;
  padding:0 max(8vw,28px);clip-path:polygon(0 0,0 0,0 100%,0 100%);visibility:hidden;transition:clip-path .65s cubic-bezier(.7,0,.2,1),visibility 0s .65s}
body.menu-open .menu{clip-path:polygon(0 0,130% 0,100% 100%,0 100%);visibility:visible;transition:clip-path .65s cubic-bezier(.7,0,.2,1)}
.menu nav{position:relative;display:flex;flex-direction:column;gap:2px}
.menu nav a{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(3rem,9vw,6.4rem);line-height:1;text-decoration:none;width:max-content;transition:color .2s,transform .25s}
.menu nav a:hover{color:var(--white);transform:translateX(18px) skewX(-6deg)}
.menu small{position:relative;margin-top:36px;font-size:1rem;color:rgba(0,0,0,.7)}

/* Interactive Logo / Menu Button */
.logo-btn{
  position:fixed;
  z-index:25;
  top:calc(env(safe-area-inset-top,0px) + 20px);
  left:50%;
  transform:translateX(-50%);
  background:transparent;
  border:none;
  cursor:pointer;
  padding:0;
  perspective:600px;
  height:48px;
  min-width:110px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-inner{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-style:preserve-3d;
  transition:transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.logo-btn:hover .logo-inner,
body.menu-open .logo-btn .logo-inner{
  transform:rotateY(180deg);
}

.logo-front, .logo-back{
  position:absolute;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  inset:0;
}

.logo-front img{
  max-height:48px;
  width:auto;
  display:block;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
}

.logo-back{
  transform:rotateY(180deg);
  font-family:var(--display);
  font-style:italic;
  font-weight:800;
  font-size:1.3rem;
  letter-spacing:0.12em;
  color:var(--pink);
  text-transform:uppercase;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

/* Header Right: Brand & Language Switcher */
.header-right {
  position:fixed;
  z-index:15;
  top:calc(env(safe-area-inset-top,0px) + 26px);
  right:28px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.14em;text-transform:uppercase}
.brand::before{content:"";display:inline-block;width:24px;height:2px;background:var(--pink);vertical-align:middle;margin-right:10px}

.lang-switch {
  display:flex;
  gap:6px;
  font-size:0.8rem;
  font-weight:600;
  letter-spacing:0.05em;
  background:rgba(255,255,255,0.06);
  padding:4px 8px;
  border-radius:4px;
}
.lang-btn {
  background:none;
  border:none;
  color:rgba(255,255,255,0.4);
  cursor:pointer;
  padding:2px 4px;
  transition:color 0.2s;
  font-family:inherit;
}
.lang-btn:hover, .lang-btn.active {
  color:var(--pink);
}

/* hero slide */
.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:100px 24px 60px;
  overflow:hidden;
  background:radial-gradient(60% 45% at 50% 46%,rgba(185,164,232,.2),transparent 70%),var(--black);
}
.photo{position:relative;width:min(1000px,90vw);aspect-ratio:16/8;display:flex;align-items:center;justify-content:center;background:#0c0c0c;overflow:hidden}
.photo span{font-size:.95rem;color:rgba(255,255,255,.35)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

/* СТИЛИ ФОРМЫ ВВОДА КОДА */
.code-access-form {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
  z-index: 5;
}
.code-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}
.code-input {
  font-family: var(--display);
  font-style: italic;
  font-weight: 800;
  font-size: 1.3rem;
  letter-spacing: 0.15em;
  text-align: center;
  background: rgba(255,255,255,0.05);
  border: none;
  border-bottom: 2px solid rgba(255,255,255,0.3);
  color: var(--white);
  padding: 8px 14px;
  width: 190px;
  text-transform: uppercase;
  transition: border-color 0.25s, color 0.25s;
}
.code-input:focus {
  outline: none;
  border-color: var(--pink);
  background: rgba(244,163,201,0.08);
}
.code-input.error {
  border-color: #ff4d4d;
  color: #ff4d4d;
  animation: shake 0.4s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}
.code-btn {
  --cut: 10px;
  font-family: var(--display);
  font-weight: 800;
  font-style: italic;
  text-transform: uppercase;
  font-size: 1rem;
  letter-spacing: 0.08em;
  padding: 8px 18px;
  border: 0;
  background: var(--lav);
  color: var(--black);
  cursor: pointer;
  transition: background 0.25s;
}
.code-btn:hover {
  background: var(--pink);
}
.code-error-msg {
  font-size: 0.8rem;
  color: #ff4d4d;
  letter-spacing: 0.05em;
  font-weight: 500;
  min-height: 1.2em;
  visibility: hidden;
}
.code-error-msg.visible {
  visibility: visible;
}

/* Скрываем поле ввода после успешной разблокировки */
body.unlocked-site .code-access-form {
  display: none;
}

.side{position:absolute;bottom:26px;font-size:.95rem;color:rgba(255,255,255,.65);text-decoration:none}
.side.l{left:max(5vw,24px)}.side.r{right:max(5vw,24px)}
.side:hover{color:var(--pink)}

/* contact slide */
.contact{
  background:var(--black);
  color:var(--white);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:85px max(7vw,28px) 20px;
  overflow-y:auto;
}
.contact-grid{
  display:grid;
  grid-template-columns:1fr 1.05fr;
  gap:clamp(20px,4vw,60px);
  align-items:center;
  width:100%;
  margin-bottom:20px;
}
.contact-grid>*{position:relative;z-index:1}
.contact h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(3rem,7vw,6rem);line-height:.92}
.contact .lead{margin-top:16px;max-width:36ch;font-size:1rem;line-height:

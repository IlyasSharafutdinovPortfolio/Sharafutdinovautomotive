<style>
:root {
  --black: #050507;
  --card-bg: #0b0c0e;
  /* РОЗОВО-ЛАВАНДОВАЯ ГАММА ПОД ЦВЕТ ЛОГО */
  --lavender: #b9a4e8;
  --plum-pink: #d488b8;
  --accent-glow: rgba(185, 164, 232, 0.3);
  --border-lavender: rgba(185, 164, 232, 0.25);
  
  --chrome: #e2e8f0;
  --titanium: #1e2229;
  --white: #ffffff;
  --gray-muted: rgba(255, 255, 255, 0.55);
  --font-title: 'Cinzel', serif;
  --font-body: 'Montserrat', sans-serif;
  --cut: 16px;
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

html {
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--black);
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; scroll-snap-type: none; }
  * { animation: none !important; transition: none !important; }
}

body {
  font-family: var(--font-body);
  background: var(--black);
  color: var(--white);
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(circle at 50% 0%, rgba(185, 164, 232, 0.08) 0%, transparent 60%);
}

a { color: inherit; }
:focus-visible { outline: 1px solid var(--lavender); outline-offset: 4px; }

/* RESTRAIN SCROLL UNTIL CODE UNLOCKED */
body.locked { overflow: hidden !important; }
body.locked .contact,
body.locked .burger,
body.locked .logo-btn,
body.locked .side.r { display: none !important; }

/* SLIDE STRUCTURE */
.slide {
  height: 100vh;
  min-height: 100svh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  box-sizing: border-box;
}

.chamfer {
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}

/* NAVIGATION BURGER */
.burger {
  position: fixed;
  z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 24px);
  left: 28px;
  width: 52px;
  height: 44px;
  border: 1px solid var(--border-lavender);
  cursor: pointer;
  background: rgba(5, 5, 7, 0.85);
  backdrop-filter: blur(12px);
  --cut: 10px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  transition: all 0.3s ease;
}

.burger span {
  display: block;
  height: 1.5px;
  background: var(--lavender);
  transition: transform 0.3s, opacity 0.2s, width 0.3s;
}
.burger span:nth-child(1) { width: 24px; }
.burger span:nth-child(2) { width: 16px; }
.burger span:nth-child(3) { width: 24px; }

.burger:hover {
  border-color: var(--plum-pink);
  box-shadow: 0 0 15px var(--accent-glow);
}

body.menu-open .burger { background: var(--black); border-color: var(--lavender); }
body.menu-open .burger span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 22px; }
body.menu-open .burger span:nth-child(2) { opacity: 0; }
body.menu-open .burger span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); width: 22px; }

/* FULLSCREEN NAVIGATION MENU */
.menu {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(5, 5, 7, 0.96);
  backdrop-filter: blur(25px);
  color: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 max(10vw, 32px);
  clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
  visibility: hidden;
  transition: clip-path 0.7s cubic-bezier(0.7, 0, 0.2, 1), visibility 0s 0.7s;
  border-right: 1px solid var(--border-lavender);
}

body.menu-open .menu {
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  visibility: visible;
  transition: clip-path 0.7s cubic-bezier(0.7, 0, 0.2, 1);
}

.menu nav { display: flex; flex-direction: column; gap: 12px; }
.menu nav a {
  font-family: var(--font-title);
  font-weight: 700;
  text-transform: uppercase;
  font-size: clamp(2.2rem, 6vw, 4.8rem);
  letter-spacing: 0.08em;
  line-height: 1.1;
  text-decoration: none;
  color: var(--white);
  transition: color 0.3s, transform 0.3s;
  width: max-content;
}
.menu nav a:hover {
  color: var(--lavender);
  transform: translateX(16px);
  text-shadow: 0 0 20px var(--accent-glow);
}
.menu small {
  margin-top: 48px;
  font-size: 0.85rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gray-muted);
}

/* INTERACTIVE LOGO */
.logo-btn {
  position: fixed;
  z-index: 25;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: 50%;
  transform: translateX(-50%);
  background: transparent;
  border: none;
  cursor: pointer;
  perspective: 600px;
  height: 48px;
  min-width: 140px;
}

.logo-inner {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.logo-btn:hover .logo-inner,
body.menu-open .logo-btn .logo-inner { transform: rotateY(180deg); }

.logo-front, .logo-back {
  position: absolute;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  inset: 0;
}

.logo-front img {
  max-height: 44px;
  width: auto;
  filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8));
}

.logo-back {
  transform: rotateY(180deg);
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: 0.25em;
  color: var(--plum-pink);
  text-shadow: 0 0 12px var(--accent-glow);
}

/* HEADER RIGHT */
.header-right {
  position: fixed;
  z-index: 15;
  top: calc(env(safe-area-inset-top, 0px) + 26px);
  right: 28px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.brand {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--white);
}
.brand::before {
  content: "";
  display: inline-block;
  width: 18px;
  height: 1px;
  background: var(--lavender);
  vertical-align: middle;
  margin-right: 12px;
}

.lang-switch {
  display: flex;
  gap: 4px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 3px 6px;
  border-radius: 2px;
}
.lang-btn {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.4);
  cursor: pointer;
  padding: 2px 6px;
  transition: all 0.2s;
  font-family: var(--font-body);
}
.lang-btn:hover, .lang-btn.active { color: var(--lavender); }

/* HERO SLIDE */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 24px 60px;
  overflow: hidden;
  background: radial-gradient(70% 50% at 50% 50%, rgba(185, 164, 232, 0.07) 0%, rgba(5,5,7,0.95) 70%), var(--black);
}

.hero-subtitle {
  font-family: var(--font-title);
  font-size: 0.8rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--lavender);
  margin-bottom: 14px;
}

.photo {
  position: relative;
  width: min(1050px, 92vw);
  aspect-ratio: 16/8;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(11, 12, 14, 0.6);
  border: 1px solid var(--border-lavender);
  box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 40px rgba(0,0,0,0.5);
  overflow: hidden;
}

.photo span {
  font-family: var(--font-title);
  font-size: 0.85rem;
  letter-spacing: 0.2em;
  color: var(--gray-muted);
  text-transform: uppercase;
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* TECH BADGES OVER PHOTO */
.tech-spec-bar {
  position: absolute;
  bottom: 0;
  inset-x: 0;
  background: rgba(5, 5, 7, 0.85);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border-lavender);
  display: flex;
  justify-content: space-around;
  padding: 10px 16px;
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gray-muted);
}
.tech-spec-bar strong { color: var(--lavender); font-family: var(--font-title); }

/* PRIVATE ACCESS CODE FORM */
.code-access-form {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 5;
}

.code-input-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(11, 12, 14, 0.8);
  border: 1px solid var(--border-lavender);
  padding: 6px 8px 6px 16px;
}

.code-input {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: 0.25em;
  text-align: center;
  background: transparent;
  border: none;
  color: var(--lavender);
  width: 170px;
  text-transform: uppercase;
}
.code-input::placeholder { color: rgba(255,255,255,0.25); font-weight: 400; font-size: 0.85rem; letter-spacing: 0.15em; }
.code-input:focus { outline: none; }
.code-input.error { color: #ff4d4d; animation: shake 0.4s ease-in-out; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

.code-btn {
  --cut: 8px;
  font-family: var(--font-title);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  padding: 10px 22px;
  border: 1px solid var(--lavender);
  background: var(--lavender);
  color: var(--black);
  cursor: pointer;
  transition: all 0.3s;
}
.code-btn:hover {
  background: transparent;
  color: var(--lavender);
  box-shadow: 0 0 15px var(--accent-glow);
}

.code-error-msg {
  font-size: 0.72rem;
  color: #ff4d4d;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  min-height: 1.2em;
  visibility: hidden;
}
.code-error-msg.visible { visibility: visible; }

body.unlocked-site .code-access-form { display: none; }

.side {
  position: absolute;
  bottom: 24px;
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray-muted);
  text-decoration: none;
  transition: color 0.3s;
}
.side.l { left: max(5vw, 28px); }
.side.r { right: max(5vw, 28px); }
.side:hover { color: var(--lavender); }

/* CONTACT & ATELIER REQUEST SLIDE */
.contact {
  background: var(--black);
  color: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 95px max(7vw, 28px) 24px;
  overflow-y: auto;
  background-image: radial-gradient(circle at 80% 80%, rgba(185, 164, 232, 0.05) 0%, transparent 50%);
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: clamp(30px, 5vw, 70px);
  align-items: start;
  width: 100%;
  max-width: 1200px;
  margin-bottom: 24px;
}

.contact h2 {
  font-family: var(--font-title);
  font-weight: 800;
  text-transform: uppercase;
  font-size: clamp(2.5rem, 5.5vw, 4.5rem);
  line-height: 1.05;
  letter-spacing: 0.04em;
  color: var(--white);
}

.contact .lead {
  margin-top: 20px;
  max-width: 38ch;
  font-size: 0.92rem;
  line-height: 1.7;
  color: var(--gray-muted);
}

.info { margin-top: 32px; display: grid; gap: 18px; }
.info div { padding-left: 18px; border-left: 2px solid var(--lavender); }
.info dt { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--gray-muted); margin-bottom: 4px; }
.info dd { font-family: var(--font-title); font-size: 1.15rem; font-weight: 700; letter-spacing: 0.05em; color: var(--white); }
.info a { text-decoration: none; transition: color 0.3s; }
.info a:hover { color: var(--lavender); }

/* FORM STYLE */
form#request {
  background: rgba(11, 12, 14, 0.7);
  border: 1px solid var(--border-lavender);
  padding: clamp(24px, 3vw, 36px);
  display: grid;
  gap: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

form h3 {
  font-family: var(--font-title);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 1.4rem;
  letter-spacing: 0.1em;
  color: var(--lavender);
  margin-bottom: 4px;
}

label { display: grid; gap: 6px; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray-muted); }

input, select, textarea {
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--white);
  background: rgba(255, 255, 255, 0.03);
  border: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  padding: 10px 12px;
  border-radius: 0;
  transition: all 0.3s;
}
select option { background: var(--black); color: var(--white); }
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--lavender);
  background: rgba(185, 164, 232, 0.05);
}

.legal-agree { display: flex; align-items: flex-start; gap: 10px; font-size: 0.72rem; color: var(--gray-muted); margin-top: 4px; }
.legal-agree input[type="checkbox"] { accent-color: var(--lavender); margin-top: 2px; cursor: pointer; }
.legal-agree a { color: var(--lavender); text-decoration: underline; cursor: pointer; }

button.send {
  --cut: 10px;
  margin-top: 8px;
  font-family: var(--font-title);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 0.85rem;
  letter-spacing: 0.2em;
  padding: 14px 24px;
  border: 1px solid var(--lavender);
  background: var(--lavender);
  color: var(--black);
  cursor: pointer;
  transition: all 0.3s;
}
button.send:hover { background: transparent; color: var(--lavender); box-shadow: 0 0 20px var(--accent-glow); }
.ok { display: none; color: var(--lavender); font-size: 0.85rem; font-family: var(--font-title); letter-spacing: 0.1em; }
form.sent .ok { display: block; }
form.sent button.send { opacity: 0.4; pointer-events: none; }

/* FOOTER */
footer.site-footer {
  width: 100%;
  max-width: 1200px;
  border-top: 1px solid var(--border-lavender);
  padding-top: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  font-size: 0.72rem;
  color: var(--gray-muted);
}
